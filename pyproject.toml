[project]
name = "rag-document-qa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zavesh14", email = "zavesh14@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.0",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.5.1",
    "langchain-text-splitters>=1.1.2",
    "openai>=3.0.0",
    "pandas>=3.0.5",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.2",
    "streamlit>=1.61.1",
]

[project.scripts]
rag-document-qa = "rag_document_qa:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
